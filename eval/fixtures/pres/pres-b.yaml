- id: y-annual-sourcing-note-2025
  date: 2025-11-10
  kind: case
  name: Note — sourcing the Y component during 2025
  one_liner: What the year's Y sourcing looked like, written up for the next procurement review
  body: '# Note — sourcing the Y component during 2025


    Written 10 November 2025 for the procurement review.


    ## The year

    Y was sourced under an annual agreement throughout. One batch was rejected at inspection in the

    spring and credited in full. A registration decision was taken in February and another in

    September; both went through the desk against three quotes in the ordinary way.


    ## What to take from it

    - Dimensional tolerance should be stated in the registration, not left to the inspection step.

    - Delivery windows tightened over the year and the desk should hold to the shorter one.


    This is a record for the next review.

    '
