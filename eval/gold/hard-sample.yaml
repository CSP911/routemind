# A sample of eval/gold/hard.yaml — every eighth question of each lever.
#
# It exists to put the real reranker behind the free measurement. Fusion put recall@20 at
# 0.07 on the indirect lever, which is already a hard ceiling on B1 hit@10 — the reranker
# cannot promote what was never a candidate. This checks the other direction: that the
# reranker does not also lose the few that do arrive, and that the direct control still
# comes back at 1.00 once an LLM is in the loop.
#
# Regenerate: see eval/runs/2026-09-19-break-search.md

