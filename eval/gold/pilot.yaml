# Pilot gold set — 20 questions, five per difficulty band.
#
# A plumbing check, not a result. It exists to find out whether the bands separate at all, whether
# the scoring runs end to end, and whether anything about the design breaks on contact, before
# seventy questions are written against it.
#
# **Written by the assistant that generated the corpus.** That is circular and it is why this is a
# pilot. `A_true` here is a first pass; the operator's job is the one judgment that cannot be
# derived — *does any other area also answer this?* — and the full set resolves the labeller
# question first (PREREGISTRATION.md §9).
#
# A and B are set deliberately. A is then measured from the text rather than trusted, by
# eval/gold/grade.py, and the band is computed. Where the measured A disagrees with the intent, the
# measurement wins and the intent is left in place as a record of what was attempted.
#
#   intent_A / intent_B   what the question was written to be
#   A_true                areas that contain an answer
#   D_true                documents that answer it. A set: the corpus holds a parent and its table
#   needs                 any — one area suffices · all — the answer is incomplete without both

questions:

# ── easy · A0 B0 — the question uses the document's own words, one obvious area ──
- id: e1
