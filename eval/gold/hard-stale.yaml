# Stale questions — where the *older* document is the correct answer.
#
# Every row of bench/corpus-hard carries "in force from 2026-01-01; supersedes <id>", and each family
# has a revision notice saying what changed. That makes the corpus able to answer a question the
# extension alone could not: **which version applied at the time?**
#
# These 50 questions are all dated before the revision, so the correct answer is the document the
# extension replaced. Returning the new row is an anachronism — the mirror image of the stale answer
# the indirect questions test for, and the reason both directions are needed. A system that always
# reaches for the newest document passes one and fails the other.
#
# **Not templated.** Each was written against what the superseded document actually says, which is why
# there are ten per family and not sixty-four. Provenance differs from the rest of the set and the
# report has to say so.
#
# For the walking arm this is the harder half: the walk lands in the new section, and the revision
# notice is what tells it to go back out again.

