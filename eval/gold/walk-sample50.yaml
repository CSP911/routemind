# The routing campaign's 50 questions — stratified, and fixed before any walk.
#
#   indirect  20   four per family
#   direct    10   two per family, the control
#   temporal  20   four per lever
#
# The retrieval arms run on all 700; these are the fifty a fresh agent walks, twice — once as
# `routing` and once as `routing+overlay`. Chosen here rather than as the campaign goes, so the
# set cannot drift towards whatever was going well.

