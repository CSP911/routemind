  body: |
    # Who to call

    Written 2 October 2026. Attendance exceptions: the HR desk. Amounts and suppliers: the office &
    purchasing desk. Pay and insurance: the payroll desk.
  human: {area: procurement, parent: ga-desk, advertise: [], gold: model,
          note: "no single right place; a person might also put it at hop 0. Recorded as a draft of one defensible choice"}

- id: pg-overview
  class: generic
  name: Overview
  one_liner: A one-page overview of how a claim moves from a receipt to a payment
  body: |
    # Overview

    Written 2 October 2026. Receipt, claim, approval, desk check, payment — and where each one can stop.
  human: {area: expense, parent: evidence, advertise: [], gold: model}

- id: pg-faq
  class: generic
  name: Frequently asked questions
  one_liner: The questions the desk answers most, with one-line answers
  body: |
    # Frequently asked questions

    Written 2 October 2026. Can I use the card for this? Where is my receipt threshold? When is the
    settlement due?
  human: {area: expense, parent: corp-card, advertise: [], gold: model}

