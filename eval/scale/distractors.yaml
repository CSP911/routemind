# Twenty-five areas added to examples/back-office to make a 30-area map. Written to sit *beside* the
# five real areas, several of them on purpose close to one (travel-desk ↔ expense, legal ↔
# procurement's contract custody, it-helpdesk ↔ the lost-card steps, people-benefits ↔ attendance's
# parental leave, facilities ↔ procurement's desk). None of their documents answers a question in
# questions.yaml — a walk that picks one has to notice and go on.
areas:
  travel-desk: {use_when: "how to book a flight or a hotel through the travel agency · changing or cancelling a booking · which airlines and hotel chains we have rates with", docs: {booking: "How to request a flight or hotel booking from the travel agency", changes: "Changing or cancelling a booking, and who pays the fee", preferred: "Airlines and hotel chains with a corporate rate"}}
  legal: {use_when: "whether a contract needs legal review · who may sign on the company's behalf · a dispute, a claim or a letter from a lawyer", docs: {contract-review: "Which contracts go to legal review before signing, and how long it takes", signatories: "Who may sign on the company's behalf, by contract type", disputes: "What to do when a claim, a dispute or a lawyer's letter arrives"}}
  it-helpdesk: {use_when: "a laptop that will not start · a forgotten password or a locked account · a lost or stolen laptop or phone", docs: {lost-device: "What to do when a company laptop or phone is lost or stolen", accounts: "Resetting a password and unlocking an account", hardware: "Ordering, repairing and returning a laptop"}}
  people-benefits: {use_when: "health check-ups and medical support · the welfare points and what they can buy · congratulation and condolence gifts from the company", docs: {checkups: "The annual health check-up — who is eligible and how to book it", welfare-points: "Welfare points — how many, what they buy, when they expire", family-events: "What the company gives for a wedding, a birth or a bereavement"}}
  facilities: {use_when: "office keys and access cards · booking a meeting room · a broken chair, a leak or the air conditioning", docs: {access-cards: "Getting, replacing and returning an office access card", meeting-rooms: "Booking a meeting room and the rules for large rooms", repairs: "Reporting something broken in the office"}}
  security: {use_when: "a suspicious email or a phishing attempt · classifying a document as confidential · visitors and guest badges", docs: {phishing: "What to do with a suspicious email", classification: "How documents are classified and what each level allows", visitors: "Registering a visitor and the guest badge"}}
  recruiting: {use_when: "opening a position and getting headcount approved · interviewing a candidate · referring a friend for a job", docs: {headcount: "Opening a position and the headcount approval", interviews: "Interview stages and how feedback is written", referrals: "The referral programme and its bonus"}}
  onboarding: {use_when: "what a new joiner does in the first week · the equipment and accounts a new joiner gets · who a new joiner's buddy is", docs: {first-week: "The first week of a new joiner, day by day", setup: "Equipment and accounts prepared before a joiner arrives", buddy: "The buddy programme"}}
  training: {use_when: "mandatory training and its deadlines · booking an external course or a conference · the learning budget", docs: {mandatory: "Mandatory courses — which, by when, and what happens if missed", external: "Booking an external course or conference", budget: "The yearly learning budget per person"}}
  performance: {use_when: "the annual review and how ratings are given · setting goals for the year · a promotion", docs: {review: "How the annual review runs and how ratings are calibrated", goals: "Setting and updating yearly goals", promotion: "How a promotion is proposed and decided"}}
  compensation: {use_when: "the salary band for a role · the annual pay rise · bonuses and incentives", docs: {bands: "Salary bands by grade", raises: "How the annual pay rise is decided", bonus: "The annual bonus and sales incentives"}}
  marketing: {use_when: "using the company logo or brand · publishing on the company blog or social media · sponsoring an event", docs: {brand: "Logo and brand guidelines", publishing: "Publishing on the blog and social accounts", sponsorship: "How a sponsorship is proposed"}}
  sales-ops: {use_when: "registering a deal in the CRM · discount approval for a quote · a customer's credit check", docs: {crm: "What to record in the CRM and when", discounts: "Who approves which discount on a quote", credit: "Running a credit check on a new customer"}}
  customer-support: {use_when: "a customer complaint and how fast to answer · escalating a ticket · a refund to a customer", docs: {complaints: "Handling a complaint and the response times", escalation: "When and how a ticket is escalated", refunds: "Approving a refund to a customer"}}
  engineering-oncall: {use_when: "being on call and what pays for it · an outage and the incident process · a post-mortem", docs: {oncall: "The on-call rota and the on-call allowance", incidents: "The incident process during an outage", postmortems: "Writing a post-mortem"}}
  data-privacy: {use_when: "personal data of customers or employees · a request to delete someone's data · a data breach", docs: {personal-data: "What counts as personal data and how to store it", deletion: "Handling a request to delete personal data", breach: "Reporting a data breach and the deadline"}}
  sustainability: {use_when: "recycling and waste in the office · the carbon report · green commuting support", docs: {waste: "Recycling and waste rules", carbon: "How the yearly carbon report is compiled", commuting: "Support for cycling and public transport"}}
  internal-comms: {use_when: "the all-hands meeting · sending an announcement to everyone · the intranet", docs: {all-hands: "The monthly all-hands", announcements: "Who may send a company-wide announcement", intranet: "Publishing a page on the intranet"}}
  quality: {use_when: "an ISO audit · a non-conformity report · a process document that needs control", docs: {audit: "Preparing for an ISO audit", nonconformity: "Raising and closing a non-conformity", doc-control: "Controlled process documents and their versions"}}
  research-grants: {use_when: "applying for a government research grant · reporting on a funded project · eligible costs under a grant", docs: {apply: "Applying for a research grant", reporting: "Reporting on a funded project", eligible: "Which costs a grant will pay"}}
  partnerships: {use_when: "a partnership or a reseller agreement · a joint marketing activity with a partner · a partner's access to our systems", docs: {agreements: "Partnership and reseller agreements", joint: "Joint activities with a partner", partner-access: "Giving a partner access to our systems"}}
  investor-relations: {use_when: "a question from an investor or the press about results · the quiet period before results · insider rules", docs: {inquiries: "Answering an investor or the press", quiet-period: "The quiet period", insiders: "Insider rules and trading windows"}}
  health-safety: {use_when: "an accident at work · a fire drill or evacuation · first aid and the first-aiders", docs: {accidents: "Reporting an accident at work", evacuation: "Fire drills and evacuation", first-aid: "First aid and who the first-aiders are"}}
  mobility: {use_when: "a transfer to another office or country · a secondment · relocation support", docs: {transfer: "Applying for a transfer", secondment: "Secondments and how they are arranged", relocation: "What relocation support covers"}}
  offboarding: {use_when: "resigning and the notice period · the last day and returning equipment · a reference letter", docs: {resigning: "Resigning and the notice period", last-day: "The last day and what to return", references: "Asking for a reference letter"}}
