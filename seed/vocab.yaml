# Your domain's vocabulary — this file IS your domain.
#
# The kinds below are a starting point, not a schema. Replace them with the words your domain
# actually uses. A node's `kind` must appear here. A kind marked `export: no` is never readable through a circuit,
# whatever its area says (docs/CIRCUIT.md) — that is the one thing a kind does.

budgets:
  kinds: 12                 # more kinds than this and it has stopped being a classification
  entities: 120             # every addressable thing. Was `nodes: 70` when a file had no address —
                            # flattening made files addressable without adding knowledge, so the
                            # unit changed and the number is restated, not raised.
  children_per_entity: 25   # one listing, read at once. The old budget could not see this: a
                            # representative with 16 files under it counted as one node.

# What a node's kind is when nobody chose one and there is no LLM to. A kind is read only by
# `export: no`, so this keeps the screen from asking for a value with no effect.
# `document` rather than `system` since 2026-10-10: on an empty install the first thing anyone adds
# is a document, and it was being filed as "a service, a daemon".
default_kind: document

kinds:
- id: document
  desc: something to read — a policy, a procedure, a note. Rename or split it once your domain has its words
- id: topic
  desc: a place that only groups what is under it — nothing to read in itself
- id: system
  desc: something we build and run — a service, a daemon, an application
- id: tool
  desc: something we did not build but operate — a product, a SaaS, a CI server
- id: store
  desc: where the bytes actually sit — a repository, a database, a bucket
- id: host
  desc: where a process runs — a server, an instance, a cluster
- id: channel
  desc: a route to the outside — delivery, publishing, notification
- id: task
  desc: a named piece of work that recurs
- id: party
  desc: a person, a team, an outside organisation
