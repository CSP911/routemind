# RouteMind — one backbone, its screen, and the exchange it meets other backbones at.
#
#   docker compose up -d   →   http://localhost:${WEB_PORT:-8080}
#
# **The exchange is here from the start, with one backbone attached to it.** A second backbone is
# then one file and one registration away, and nothing about the first one changes — which is the
# whole reason for meeting at an exchange rather than pairing off. Wiring it in later would mean
# rewriting the first backbone's `peers.yaml` at the moment somebody is already busy adding a second.
#
# With one backbone it reflects nothing and costs a container. That is the price of the third one
# being free, and of the second not being a migration.
#
#   docker compose -f docker-compose.yml -f docker-compose.peer.yml up -d    a second backbone
#   docker compose -f docker-compose.yml -f docker-compose.admin.yml up -d   the operator's screen
#
# The ontology API is not published. The only way in is the web container's proxy, which is also the
# one place an actor is stamped on a write. Publishing 8100 would route around both.
services:
  ontology:
    build:
      context: .
      dockerfile: ontology/Dockerfile
    image: knowledge-ontology:${IMAGE_TAG:-0.1.0}
    # The data directory is a git repository on the host and writes commit into it, so this must be
    # the uid that owns it. Wrong uid = every write fails at the commit, after the file was written.
    # `UID` is readonly in bash and is not exported to compose, so it silently stays 1000 and every
    # write then fails at the commit — after the file was already written. Its own name, from .env.
    user: "${KNOWLEDGE_UID:-1000}:${KNOWLEDGE_GID:-1000}"
    environment:
      ONTOLOGY_DATA: /data/repo
      ONTOLOGY_PUBLISH: /data/publish
      # Overlays (docs/OVERLAY.md): one question's working set each — run evidence, not structure. Their
      # own directory: not the repository (a commit per question would bury the ontology) and not
      # publish/ (a checkout swapped atomically; anything beside it would be published by accident).
      ONTOLOGY_OVERLAYS: /data/overlays
      # The curator's store — the review queue behind "Advertise upstream", and what `sleep` writes.
      # Unset, every proposal is refused 501 and the screen shows the name of this variable to whoever
      # pressed Submit. It was unset here until 2026-09-12, which meant the review queue had never
      # worked on any install made from this file. Its own directory, for the overlays' reason: a
      # commit per proposal would bury the ontology.
      ONTOLOGY_HARNESS: /data/harness
      # How long a write waits for another process holding this data directory before it answers that
      # one is. One ontology per directory is the rule; the lock is what makes breaking it merely slow
      # instead of destructive. Documented in .env.example, so it has to arrive here to be real.
      ONTOLOGY_LOCK_WAIT: "${ONTOLOGY_LOCK_WAIT:-}"
      # The shared secret a *peer* backbone presents to read /v1/export. Unset — the default —
      # makes that whole surface answer 501, which is right: opening a link is a decision.
      # Everything a link needs beyond this is in peers.yaml, in the data repository, because
      # who this backbone is linked to belongs in git and a secret does not. docs/PEERING.md.
      # What this backbone accepts from the exchange, and what it presents to it. One secret, both
      # directions — install.sh writes it on the first run.
      ONTOLOGY_PEER_TOKEN: "${EXCHANGE_TOKEN_HOME:-}"
      ONTOLOGY_PEER_TOKEN_IX: "${EXCHANGE_TOKEN_HOME:-}"
      ONTOLOGY_PEER_TTL: "${ONTOLOGY_PEER_TTL:-}"
      ONTOLOGY_PEER_TIMEOUT: "${ONTOLOGY_PEER_TIMEOUT:-}"
      # Set these three and Knowledge derives a node's id, kind and description from its name. Leave
      # them out and those are typed by hand — the screen asks for them only in that case.
      # `litellm` is the default because it is what the client always spoke — an existing install
      # behaves the same without touching anything. A provider this build does not know turns the LLM
      # off and says so in the log rather than being quietly ignored.
      ONTOLOGY_LLM_PROVIDER: "${ONTOLOGY_LLM_PROVIDER:-litellm}"
      ONTOLOGY_LLM_BASE_URL: "${ONTOLOGY_LLM_BASE_URL:-}"
      ONTOLOGY_LLM_API_KEY: "${ONTOLOGY_LLM_API_KEY:-}"
      ONTOLOGY_LLM_MODEL: "${ONTOLOGY_LLM_MODEL:-}"
      ONTOLOGY_LLM_MAX_TOKENS: "${ONTOLOGY_LLM_MAX_TOKENS:-}"
      ONTOLOGY_LLM_TEMPERATURE: "${ONTOLOGY_LLM_TEMPERATURE:-}"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DATA_DIR:-./data/repo}
        target: /data/repo
      - type: bind
        source: ${KNOWLEDGE_PUBLISH_DIR:-./data/publish}
        target: /data/publish
      - type: bind
        source: ${KNOWLEDGE_OVERLAYS_DIR:-./data/overlays}
        target: /data/overlays
      - type: bind
        source: ${KNOWLEDGE_HARNESS_DIR:-./data/harness}
        target: /data/harness
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: knowledge-web:${IMAGE_TAG:-0.1.0}
    depends_on:
      ontology:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_URL: http://ontology:8100
      # Where "▶ Start" sends the areas a person picked. Empty = no such button.
      KNOWLEDGE_AGENT_URL: "${KNOWLEDGE_AGENT_URL:-}"
      # The name on every commit made through the screen.
      KNOWLEDGE_ACTOR: "${KNOWLEDGE_ACTOR:-web}"
      # The door. open (the default) | token | proxy — see .env.example and the README.
      KNOWLEDGE_AUTH: "${KNOWLEDGE_AUTH:-open}"
      KNOWLEDGE_TOKEN: "${KNOWLEDGE_TOKEN:-}"
      KNOWLEDGE_AUTH_HEADER: "${KNOWLEDGE_AUTH_HEADER:-X-Forwarded-Email}"
      KNOWLEDGE_AUTH_TRUSTED_PROXY: "${KNOWLEDGE_AUTH_TRUSTED_PROXY:-}"
      KNOWLEDGE_AUTH_READS: "${KNOWLEDGE_AUTH_READS:-}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  # Where backbones meet. It has no repository, no areas and no hop 0 — so it cannot become one, and
  # the sentence the whole design rests on has no third kind of thing to be confused about. With a
  # single backbone it has nothing to reflect and simply waits. docs/PEERING.md.
  exchange:
    build:
      context: .
      dockerfile: exchange/Dockerfile
    image: routemind-exchange:${IMAGE_TAG:-0.1.0}
    user: "${KNOWLEDGE_UID:-1000}:${KNOWLEDGE_GID:-1000}"
    environment:
      EXCHANGE_NAME: "${EXCHANGE_NAME:-ix}"
      EXCHANGE_MEMBERS: /data/members.yaml
      # One secret per member, used in both directions — which is what lets the exchange know who is
      # calling, and spare a member its own advertisement coming back at it. install.sh writes the
      # first one; the operator's screen prints the next.
      EXCHANGE_TOKEN_HOME: "${EXCHANGE_TOKEN_HOME:-}"
      EXCHANGE_TOKEN_BRANCH: "${EXCHANGE_TOKEN_BRANCH:-}"
      EXCHANGE_ADMIN_TOKEN: "${EXCHANGE_ADMIN_TOKEN:-}"
      ONTOLOGY_PEER_TTL: "${ONTOLOGY_PEER_TTL:-}"
      ONTOLOGY_PEER_TIMEOUT: "${ONTOLOGY_PEER_TIMEOUT:-}"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_EXCHANGE_DIR:-./data/exchange}
        target: /data
    restart: unless-stopped
