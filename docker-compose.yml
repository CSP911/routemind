# RouteMind — one backbone and its screen.
#
#   docker compose up -d   →   http://localhost:${WEB_PORT:-8080}
#
# The ontology API is not published. The only way in is the web container's proxy, which is also the
# one place an actor is stamped on a write. Publishing 8100 would route around both.
services:
  ontology:
    build:
      context: .
      dockerfile: ontology/Dockerfile
    image: knowledge-ontology:${IMAGE_TAG:-0.1.0}
    # The data directory is a git repository on the host and writes commit into it, so this must be
    # the uid that owns it. Wrong uid = every write fails at the commit, after the file was written.
    # `UID` is readonly in bash and is not exported to compose, so it silently stays 1000 and every
    # write then fails at the commit — after the file was already written. Its own name, from .env.
    user: "${KNOWLEDGE_UID:-1000}:${KNOWLEDGE_GID:-1000}"
    environment:
      ONTOLOGY_DATA: /data/repo
      # Overlays (docs/OVERLAY.md): one question's working set each — run evidence, not structure. Their
      # own directory, not the repository: a commit per question would bury the ontology. **Off unless
      # set** (operator, 2026-10-08): with it empty the map draws no VRFs and the agent has no overlay
      # tool. `ONTOLOGY_OVERLAYS=/data/overlays` in .env turns the store and the map's half on; the
      # agent's tool also needs `KNOWLEDGE_TOOLS_EXTRA=overlay` where its MCP server runs.
      ONTOLOGY_OVERLAYS: "${ONTOLOGY_OVERLAYS:-}"
      # The footprint (docs/FOOTPRINT.md): every walk an agent takes, kept six hours — the map's live
      # view and its replay. Run evidence, like overlays.
      ONTOLOGY_WALKS: /data/walks
      # The curator's store — the review queue behind "Advertise upstream".
      # Unset, every proposal is refused 501 and the screen shows the name of this variable to whoever
      # pressed Submit. It was unset here until 2026-09-12, which meant the review queue had never
      # worked on any install made from this file. Its own directory, for the overlays' reason: a
      # commit per proposal would bury the ontology.
      ONTOLOGY_HARNESS: /data/harness
      # Who read what across a link. A relayed document is held for one request and discarded, so
      # nothing anywhere remembers unless the owner writes a line — and every read through an
      # circuit arrives from wherever the reader runs, so the HTTP log says little. Its own
      # directory, one file per UTC day, and to stderr as well so an install that mounts nothing
      # still has the record. docs/CIRCUIT.md.
      ONTOLOGY_ACCESS: /data/access
      # How long a write waits for another process holding this data directory before it answers that
      # one is. One ontology per directory is the rule; the lock is what makes breaking it merely slow
      # instead of destructive. Documented in .env.example, so it has to arrive here to be real.
      ONTOLOGY_LOCK_WAIT: "${ONTOLOGY_LOCK_WAIT:-}"
      # The key another backbone's circuit presents to read the areas set `export` here. Empty — the
      # default before install.sh runs — makes that whole surface answer 501. EXCHANGE_TOKEN_HOME is
      # what an install made before 2026-10-08 has in .env under the old name; it is read when the new
      # one is not set, so updating changes nothing about who can read you. docs/CIRCUIT.md.
      ONTOLOGY_PEER_TOKEN: "${KNOWLEDGE_CIRCUIT_TOKEN:-${EXCHANGE_TOKEN_HOME:-}}"
      # How long a circuit's session lasts, in seconds (docs/CIRCUIT.md). Six hours when empty. Read by
      # the service and documented since 2026-09-29, but never passed in, so setting it changed nothing.
      ONTOLOGY_PEER_SESSION_TTL: "${ONTOLOGY_PEER_SESSION_TTL:-}"
      # Set these three and Knowledge derives a node's id, kind and description from its name. Leave
      # them out and those are typed by hand — the screen asks for them only in that case.
      # `litellm` is the default because it is what the client always spoke — an existing install
      # behaves the same without touching anything. A provider this build does not know turns the LLM
      # off and says so in the log rather than being quietly ignored.
      ONTOLOGY_LLM_PROVIDER: "${ONTOLOGY_LLM_PROVIDER:-litellm}"
      ONTOLOGY_LLM_BASE_URL: "${ONTOLOGY_LLM_BASE_URL:-}"
      ONTOLOGY_LLM_API_KEY: "${ONTOLOGY_LLM_API_KEY:-}"
      ONTOLOGY_LLM_MODEL: "${ONTOLOGY_LLM_MODEL:-}"
      ONTOLOGY_LLM_MAX_TOKENS: "${ONTOLOGY_LLM_MAX_TOKENS:-}"
      ONTOLOGY_LLM_TEMPERATURE: "${ONTOLOGY_LLM_TEMPERATURE:-}"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DATA_DIR:-./data/repo}
        target: /data/repo
      - type: bind
        source: ${KNOWLEDGE_OVERLAYS_DIR:-./data/overlays}
        target: /data/overlays
      - type: bind
        source: ${KNOWLEDGE_WALKS_DIR:-./data/walks}
        target: /data/walks
      - type: bind
        source: ${KNOWLEDGE_HARNESS_DIR:-./data/harness}
        target: /data/harness
      - type: bind
        source: ${KNOWLEDGE_ACCESS_DIR:-./data/access}
        target: /data/access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: knowledge-web:${IMAGE_TAG:-0.1.0}
    depends_on:
      ontology:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_URL: http://ontology:8100
      # The name on every commit made through the screen.
      KNOWLEDGE_ACTOR: "${KNOWLEDGE_ACTOR:-web}"
      # The door. open (the default) | token | proxy — see .env.example and the README.
      KNOWLEDGE_AUTH: "${KNOWLEDGE_AUTH:-open}"
      KNOWLEDGE_TOKEN: "${KNOWLEDGE_TOKEN:-}"
      KNOWLEDGE_AUTH_HEADER: "${KNOWLEDGE_AUTH_HEADER:-X-Forwarded-Email}"
      KNOWLEDGE_AUTH_TRUSTED_PROXY: "${KNOWLEDGE_AUTH_TRUSTED_PROXY:-}"
      KNOWLEDGE_AUTH_READS: "${KNOWLEDGE_AUTH_READS:-}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
