# A second backbone, meeting the first at the exchange that is already there.
#
#   docker compose -f docker-compose.yml -f docker-compose.peer.yml up -d
#   →  http://localhost:8080  this one      http://localhost:8081  the other
#
# **Nothing about the first backbone changes.** Its `peers.yaml` still holds one entry — the exchange
# — and it will still hold one when there are ten. That is what the exchange bought, and it is why it
# is in the base file rather than added here: wiring it at the moment somebody is adding a second
# backbone would mean rewriting the first one's configuration exactly when it is in use.
#
# Two services rather than one service with two data directories, on purpose: **this is the remote
# case with a shorter cable.** When the two are in different companies nothing changes but the URL
# and who holds the token.
#
# Both are real installs. Each has its own repository, its own review queue, its own vocabulary, and
# writes to each go through its own screen — which is the point of a link rather than a merge.
#
# Two more things are needed and neither is here, because neither is deployment:
#   * `EXCHANGE_TOKEN_BRANCH` in .env — one secret, used in both directions
#   * a member entry at the exchange, and a `peers.yaml` in this backbone's repository
# docs/PEERING.md walks both, and the operator's screen prints them.
services:
  ontology-b:
    build:
      context: .
      dockerfile: ontology/Dockerfile
    image: knowledge-ontology:0.1.0
    user: "${KNOWLEDGE_UID:-1000}:${KNOWLEDGE_GID:-1000}"
    environment:
      ONTOLOGY_DATA: /data/repo
      ONTOLOGY_PUBLISH: /data/publish
      ONTOLOGY_OVERLAYS: /data/overlays
      ONTOLOGY_HARNESS: /data/harness
      # What it accepts from the exchange, and what it presents to it. One secret, both directions.
      ONTOLOGY_PEER_TOKEN: "${EXCHANGE_TOKEN_BRANCH:-}"
      ONTOLOGY_PEER_TOKEN_IX: "${EXCHANGE_TOKEN_BRANCH:-}"
      ONTOLOGY_PEER_TTL: "${ONTOLOGY_PEER_TTL:-}"
      ONTOLOGY_LLM_PROVIDER: "${ONTOLOGY_LLM_PROVIDER:-litellm}"
      ONTOLOGY_LLM_BASE_URL: "${ONTOLOGY_LLM_BASE_URL:-}"
      ONTOLOGY_LLM_API_KEY: "${ONTOLOGY_LLM_API_KEY:-}"
      ONTOLOGY_LLM_MODEL: "${ONTOLOGY_LLM_MODEL:-}"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_B_DATA_DIR:-./data-b/repo}
        target: /data/repo
      - type: bind
        source: ${KNOWLEDGE_B_PUBLISH_DIR:-./data-b/publish}
        target: /data/publish
      - type: bind
        source: ${KNOWLEDGE_B_OVERLAYS_DIR:-./data-b/overlays}
        target: /data/overlays
      - type: bind
        source: ${KNOWLEDGE_B_HARNESS_DIR:-./data-b/harness}
        target: /data/harness
    restart: unless-stopped

  web-b:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: knowledge-web:0.1.0
    depends_on:
      ontology-b:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_URL: http://ontology-b:8100
      KNOWLEDGE_ACTOR: "${KNOWLEDGE_ACTOR_B:-web-b}"
    ports:
      - "${WEB_PORT_B:-8081}:8080"
    restart: unless-stopped
