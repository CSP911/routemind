<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="720" fill="#f7f8fa"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b0"/>
    </marker>
  </defs>

  <text x="38" y="44" font-size="12" font-weight="700" letter-spacing="2.2" fill="#2d6a5f">ONE QUESTION, SEVERAL AREAS</text>
  <text x="38" y="80" font-size="27" font-weight="700" fill="#1c2530">How an overlay gets made</text>
  <text x="38" y="105" font-size="14.5" fill="#6b7684">The agent picks the areas. RouteMind checks that they resolve — it never chooses for you.</text>

  <!-- ─── everything in this box is the agent's doing ─── -->
  <rect x="38" y="126" width="1164" height="300" rx="14" fill="#ffffff" stroke="#6d4aa7" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="56" y="112" width="112" height="28" rx="8" fill="#f4efff" stroke="#6d4aa7" stroke-width="1.2"/>
  <text x="70" y="131" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6d4aa7">THE AGENT</text>
  <text x="58" y="153" font-size="12.5" fill="#8a94a0">Claude Code · Codex · any MCP client — the model that reads the question lives here, and all four steps below are its own</text>

  <!-- 1 -->
  <rect x="58" y="164" width="260" height="240" rx="12" fill="#fcfcfd" stroke="#dfe4ea"/>
  <circle cx="84" cy="194" r="13" fill="#2d6a5f"/>
  <text x="84" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="106" y="199" font-size="15" font-weight="700" fill="#1c2530">Read hop 0</text>
  <text x="78" y="228" font-size="12.5" fill="#556070">The whole list of areas, and the</text>
  <text x="78" y="246" font-size="12.5" fill="#556070">one line each is chosen by.</text>
  <rect x="78" y="260" width="220" height="26" rx="6" fill="#f1f3f7" stroke="#e2e6ec"/>
  <text x="90" y="278" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2a5d8f">knowledge_table()</text>
  <text x="78" y="312" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">/v1/regions/expense</text>
  <text x="78" y="330" font-size="11" fill="#8a94a0">receipts · card · trip · caps</text>
  <text x="78" y="356" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">/v1/regions/payroll</text>
  <text x="78" y="374" font-size="11" fill="#8a94a0">payslip · tax free · insurance</text>

  <!-- 2 -->
  <rect x="346" y="164" width="260" height="240" rx="12" fill="#fcfcfd" stroke="#dfe4ea"/>
  <circle cx="372" cy="194" r="13" fill="#2d6a5f"/>
  <text x="372" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="394" y="199" font-size="15" font-weight="700" fill="#1c2530">Pick, and say why</text>
  <text x="366" y="228" font-size="12.5" fill="#556070">Every row the question belongs</text>
  <text x="366" y="246" font-size="12.5" fill="#556070">to. Settling a trip is three.</text>
  <rect x="366" y="260" width="220" height="112" rx="6" fill="#f1f3f7" stroke="#e2e6ec"/>
  <text x="378" y="279" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">knowledge_overlay {</text>
  <text x="378" y="296" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">  op: "create",</text>
  <text x="378" y="313" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">  question: "...",</text>
  <text x="378" y="330" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">  members: [</text>
  <text x="378" y="347" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6d4aa7">    { address, why }</text>
  <text x="378" y="364" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#43506a">  ] }</text>
  <text x="366" y="392" font-size="11" fill="#8a94a0">Addresses as printed, never built.</text>

  <!-- 3 -->
  <rect x="634" y="164" width="260" height="240" rx="12" fill="#fcfcfd" stroke="#dfe4ea"/>
  <circle cx="660" cy="194" r="13" fill="#2d6a5f"/>
  <text x="660" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="682" y="199" font-size="15" font-weight="700" fill="#1c2530">Work inside it</text>
  <text x="654" y="228" font-size="12.5" fill="#556070">One table, every member</text>
  <text x="654" y="246" font-size="12.5" fill="#556070">merged. Narrow as you read.</text>
  <rect x="654" y="260" width="220" height="26" rx="6" fill="#f1f3f7" stroke="#e2e6ec"/>
  <text x="666" y="278" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2a5d8f">op: "add" · "remove"</text>
  <text x="654" y="310" font-size="12" fill="#556070">Each with a reason, so the</text>
  <text x="654" y="328" font-size="12" fill="#556070">trail says what was thought.</text>
  <rect x="654" y="342" width="220" height="46" rx="6" fill="#fbf7ff" stroke="#ddd0f0"/>
  <text x="666" y="361" font-size="11.5" fill="#6d4aa7">Not in it? Back to hop 0 —</text>
  <text x="666" y="378" font-size="11.5" fill="#6d4aa7">3 times a run. Caps: 8 · 120.</text>

  <!-- 4 -->
  <rect x="922" y="164" width="260" height="240" rx="12" fill="#fcfcfd" stroke="#dfe4ea"/>
  <circle cx="948" cy="194" r="13" fill="#2d6a5f"/>
  <text x="948" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="970" y="199" font-size="15" font-weight="700" fill="#1c2530">Close it</text>
  <text x="942" y="228" font-size="12.5" fill="#556070">With every address the</text>
  <text x="942" y="246" font-size="12.5" fill="#556070">answer actually came from.</text>
  <rect x="942" y="260" width="220" height="26" rx="6" fill="#f1f3f7" stroke="#e2e6ec"/>
  <text x="954" y="278" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2a5d8f">op: "close", used: […]</text>
  <text x="942" y="310" font-size="12" fill="#556070">Each one is recorded as</text>
  <rect x="942" y="322" width="100" height="24" rx="6" fill="#eef4f2" stroke="#c9ded8"/>
  <text x="992" y="338" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2d6a5f" text-anchor="middle">member</text>
  <rect x="1054" y="322" width="100" height="24" rx="6" fill="#fdf3ec" stroke="#f0d6c0"/>
  <text x="1104" y="338" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a2622c" text-anchor="middle">reached</text>
  <text x="942" y="366" font-size="11" fill="#8a94a0">reached = the answer came from</text>
  <text x="942" y="382" font-size="11" fill="#8a94a0">outside the set. Drawn too coarse.</text>

  <path d="M322 284 L342 284" stroke="#9aa4b0" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M610 284 L630 284" stroke="#9aa4b0" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M898 284 L918 284" stroke="#9aa4b0" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ─── what RouteMind does with all of it ─── -->
  <path d="M620 426 L620 448" stroke="#9aa4b0" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="38" y="452" width="1164" height="66" rx="12" fill="#ffffff" stroke="#2a5d8f" stroke-width="1.6"/>
  <text x="60" y="474" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#2a5d8f">ROUTEMIND</text>
  <text x="60" y="494" font-size="13" fill="#556070">Serves the tables, refuses an address that resolves to nothing and an overlay over its caps, stores it, keeps the record.</text>
  <text x="60" y="511" font-size="13" fill="#556070"><tspan font-weight="700" fill="#1c2530">It has no model of its own</tspan> — which rows a question belongs to is never its judgment.</text>

  <!-- ─── two authors ─── -->
  <rect x="38" y="530" width="1164" height="70" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="60" y="555" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6d4aa7">TWO AUTHORS, ONE OBJECT</text>
  <text x="60" y="577" font-size="13" fill="#556070">An agent creates one through the API, as above. A person ticks areas on the map and presses <tspan font-weight="700" fill="#1c2530">Draw VRF</tspan>. Both make the same thing and the map draws either —</text>
  <text x="60" y="593" font-size="13" fill="#556070">a question is required from a person too, because a field whose rules depend on who is calling is the kind that rots.</text>

  <!-- ─── the two rules that decide whether it can be relied on ─── -->
  <rect x="38" y="610" width="574" height="92" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="60" y="636" font-size="13.5" font-weight="700" fill="#1c2530">It narrows where to look. It does not define absence.</text>
  <text x="60" y="659" font-size="12.5" fill="#556070">"Not in the overlay" never means "not in RouteMind". Only the list at</text>
  <text x="60" y="677" font-size="12.5" fill="#556070">hop 0 can say that, which is why going back to it is budgeted rather</text>
  <text x="60" y="695" font-size="12.5" fill="#556070">than barred.</text>

  <rect x="628" y="610" width="574" height="92" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="650" y="636" font-size="13.5" font-weight="700" fill="#1c2530">It is run evidence, not ontology.</text>
  <text x="650" y="659" font-size="12.5" fill="#556070">Never committed to the data repository — a commit per question would</text>
  <text x="650" y="677" font-size="12.5" fill="#556070">bury the structure it is about. It lives in its own store, expires, and</text>
  <text x="650" y="695" font-size="12.5" fill="#556070">leaves behind a record of what was used.</text>
</svg>
