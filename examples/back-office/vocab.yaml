# The vocabulary of back-office (corporate support) work — this file IS the domain.
#
# A node's `kind` must appear here; anything else is refused at the write. A kind marked
# `export: no` never crosses a link, whatever its area says — that is the one thing a kind does.

budgets:
  kinds: 12
  entities: 120
  children_per_entity: 25

# What a node's kind is when nobody chose one. A place made without thinking about it is a grouping,
# so that is the honest default.
default_kind: topic

kinds:
- id: topic
  desc: a place that only groups what is under it — nothing to read in itself
- id: rule
  desc: what is allowed and what is not — a company policy, or the law behind one
- id: procedure
  desc: an ordered way of doing something — who does what, and in what order
- id: form
  desc: a document you submit — a template, and the fields it asks for
- id: table
  desc: a table of values — amounts, caps, rates, day counts
- id: case
  desc: a situation the rules did not settle, and what was actually done about it
- id: system
  desc: where the work is recorded — the ERP, the groupware, the accounting system
- id: role
  desc: a person, a team, or an approval authority
- id: deadline
  desc: something pinned to a date — a filing deadline, a submission cut-off, a retention period
